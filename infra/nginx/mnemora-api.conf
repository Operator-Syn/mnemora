# mnemora read API behind nginx — the VPS edge.
#
# The site is TanStack Start SSR on Cloudflare Workers, so the browser never calls this API: the
# Worker does, from Cloudflare's network. That changes what the edge has to do.
#
#   1. Only GET /webhook/api/* is exposed. Everything else on n8n — the editor, /rest, the signed
#      write pipe, the telemetry endpoint — answers 404 from this server block. A proxy that
#      forwards the whole port would publish the admin UI; an allowlist is cheaper than an incident.
#   2. Rate limiting is the control that protects the worker's slots, not the API key. The key
#      proves who is calling; only a limit decides how often.
#   3. Response caching turns visitors into ~one request per minute to n8n. The data moves hourly
#      and every 200 already carries `Cache-Control: public, max-age=60`.
#
# TWO PLACEMENTS. The `http {}`-level directives (`limit_req_zone`, `proxy_cache_path`,
# `geo`/`map`) cannot live inside `server {}` — keep them in nginx.conf's http block, and include
# the server block from a sites-enabled file. The split is marked below.
#
# TLS: this block assumes certificates already exist (certbot/lego). Do not serve it on :80
# without a redirect — the read key travels in a header.

# ---------------------------------------------------------------- http {} level (nginx.conf)
#
#   # 10 requests/second per IP, burst 20. A portfolio visitor costs 4–5 calls; the API's own
#   # ceiling is ~32 req/s (measured), so this keeps a burst from reaching it.
#   limit_req_zone $binary_remote_addr zone=mnemora_read:10m rate=10r/s;
#
#   proxy_cache_path /var/cache/nginx/mnemora levels=1:2 keys_zone=mnemora_api:10m
#                    max_size=64m inactive=10m use_temp_path=off;
#
#   # Optional but strong: accept traffic only from Cloudflare. Then a leaked key is not enough —
#   # the caller must also be on Cloudflare's network. Cloudflare publishes the ranges at
#   # https://www.cloudflare.com/ips/ ; they change rarely but they do change, so a stale list is a
#   # silent outage. Enable deliberately, and keep a way to refresh it.
#   # geo $is_cloudflare {
#   #   default 0;
#   #   include /etc/nginx/snippets/cloudflare-ips.conf;   # "203.0.113.0/24 1;" per range
#   # }
#
# ---------------------------------------------------------------- server {} (sites-enabled)

server {
    listen 443 ssl;
    http2 on;
    server_name mnemora.example.com;   # REPLACE

    ssl_certificate     /etc/letsencrypt/live/mnemora.example.com/fullchain.pem;   # REPLACE
    ssl_certificate_key /etc/letsencrypt/live/mnemora.example.com/privkey.pem;     # REPLACE

    # Cloudflare terminates TLS for the visitor; between Cloudflare and this box the connection is
    # still TLS (Full mode). Without these two lines every request logs as 172.x.x.x and the rate
    # limit becomes one shared bucket for the whole internet.
    real_ip_header CF-Connecting-IP;
    # set_real_ip_from <each Cloudflare range>;   # required for real_ip to take effect

    # The Worker is the only client. If you enable the geo block above:
    # if ($is_cloudflare = 0) { return 403; }

    server_tokens off;
    client_max_body_size 4k;          # this API takes no bodies at all
    access_log /var/log/nginx/mnemora-api.access.log;
    error_log  /var/log/nginx/mnemora-api.error.log warn;

    # The whole surface: read-only, query strings allowed (?repository_id=, ?limit=, ?before_ms=).
    location /webhook/api/ {
        # Anything that is not a read is not this API.
        limit_except GET { deny all; }

        limit_req zone=mnemora_read burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5680;          # REPLACE if n8n moves; keep it on loopback
        proxy_http_version 1.1;

        # Pass the caller's key through untouched. n8n checks it against the `Mnemora Read`
        # credential before the workflow runs and answers 403 when it is missing or wrong.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout   15s;

        # Cache per URL, including the query string — the two feeds page by cursor, and a cache
        # keyed on path alone would serve page 2 to a caller asking for page 1.
        proxy_cache            mnemora_api;
        proxy_cache_key        "$scheme$request_method$host$uri$is_args$args";
        proxy_cache_valid      200 60s;
        proxy_cache_valid      400 404 10s;       # short: a 404 today may exist tomorrow
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock       on;                # one upstream fetch per key, not one per visitor
        proxy_cache_lock_timeout 5s;
        proxy_ignore_headers   Set-Cookie;        # nothing here sets one, but never let it split cache
        add_header             X-Cache-Status $upstream_cache_status always;
    }

    # Everything else on n8n stays private: the editor, /rest, the signed write pipe, telemetry.
    # 404 rather than 403 — a 403 confirms that something is there.
    location / {
        return 404;
    }
}

# Port 80 exists only to redirect. Never proxy the API over plaintext: the read key is a header.
server {
    listen 80;
    server_name mnemora.example.com;   # REPLACE
    return 301 https://$host$request_uri;
}
