# Mnemora read API — the server block deployed on node1.
#
#   /etc/nginx/conf.d/mnemora-api.conf              this file
#   /etc/nginx/conf.d/00-mnemora-read-limits.conf   zones + cache path (http context)
#
# Deploy: copy both, `nginx -t`, `systemctl reload nginx`. If `proxy_cache_key` changes, purge
# /var/cache/nginx/mnemora once — see the note in 00-mnemora-read-limits.conf.
#
# The site is TanStack Start SSR on Cloudflare Workers, so the browser never calls this API: the
# Worker does, server-to-server. That shapes what this edge has to do.
#
#   1. Only GET /webhook/api/* is public. The editor, /rest, the telemetry endpoint and the signed
#      write pipe are NetBird-only and answer 403 from a public address. A proxy that forwarded the
#      whole port would publish the admin UI; an allowlist is cheaper than an incident.
#   2. The read key is checked by n8n, not by nginx: the Webhook nodes carry the `Mnemora Read`
#      credential and answer 403 before the workflow runs.
#   3. Rate limiting and caching are the controls that protect the worker's slots — not the key. The
#      key proves who is calling; only a limit decides how often. Measured after install: 60
#      concurrent requests split 27 x 200 / 33 x 429, and repeated URLs answer from cache.
#
# HOST NGINX, NOT A CONTAINER. The chain is the Worker -> this nginx -> 127.0.0.1:5680, which is
# where compose publishes n8n (`ports: "127.0.0.1:${N8N_HOST_PORT:-5680}:5678"`). Two consequences:
#
#   * a containerised nginx resolves 127.0.0.1 to itself, not to the host, and would need the
#     compose network instead;
#   * that port must stay closed to the internet. If 5680 is reachable directly, this file is
#     decoration — every control here can be bypassed by hitting n8n straight. Check with
#     `ss -ltn | grep 5680` (expect 127.0.0.1).
#
# DNS is grey-cloud: mnemora-api.syn-forge.com resolves straight to the VPS (51.79.251.21), so no
# CF-Connecting-IP arrives and `real_ip` cannot recover a visitor address — the per-IP zone bounds
# one abusive source, not a crowd. If this hostname is ever proxied orange-cloud, add
# `real_ip_header CF-Connecting-IP` plus `set_real_ip_from` for the published Cloudflare ranges;
# without them every request logs as Cloudflare and the per-IP zone becomes one shared bucket. The
# stronger option then is a `geo $is_cloudflare` allowlist (ranges at cloudflare.com/ips), which
# means a leaked key is not enough — the caller must also be on Cloudflare's network.
#
# TLS: certificates already exist (certbot, /etc/letsencrypt/live/mnemora-api-syn-forge-com). Never
# serve the API over plaintext: the read key travels in a header.

server {
    listen 80;
    listen [::]:80;
    server_name mnemora-api.syn-forge.com;
    include /etc/nginx/snippets/00-block-common-probes.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mnemora-api.syn-forge.com;

    ssl_certificate     /etc/letsencrypt/live/mnemora-api-syn-forge-com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mnemora-api-syn-forge-com/privkey.pem;
    include /etc/nginx/snippets/00-block-common-probes.conf;
    server_tokens off;
    client_max_body_size 16m;

    # The public surface: read-only, query strings allowed (?repository_id=, ?limit=, ?before_ms=).
    location ^~ /webhook/api/ {
        # Anything that is not a read is not this API.
        limit_except GET { deny all; }

        # Abuse controls, both buckets, in this order: per source, then the whole API.
        limit_req zone=mnemora_read     burst=20 nodelay;
        limit_req zone=mnemora_read_all burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5680;
        proxy_http_version 1.1;

        # Pass the caller's key through untouched. n8n checks it against the `Mnemora Read`
        # credential before the workflow runs and answers 403 when it is missing or wrong.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Short enough that a hung execution fails over to the cached copy instead of holding a
        # connection for two minutes; `use_stale` below is what makes that a 200, not a 504.
        proxy_connect_timeout 3s;
        proxy_read_timeout   30s;
        proxy_send_timeout   10s;

        # Cache per URL, including the query string — the two feeds page by cursor, and a cache
        # keyed on path alone would serve page 2 to a caller asking for page 1.
        proxy_cache            mnemora_api;
        # The read key is part of the cache key on purpose. nginx answers a cacheable request from
        # cache before any upstream auth runs, so without it a HIT is served to a caller that never
        # presented a key — measured here: an unauthenticated GET received the full cached payload.
        # With the key in the key, a missing or wrong key is a MISS that reaches n8n and gets its
        # 403, which is not a cacheable status.
        proxy_cache_key        "$scheme$request_method$host$uri$is_args$args$http_x_mnemora_read_key";
        proxy_cache_valid      200 60s;
        proxy_cache_valid      400 404 10s;       # short: a 404 today may exist tomorrow
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock       on;                # one upstream fetch per key, not one per visitor
        proxy_cache_lock_timeout 5s;
        proxy_ignore_headers   Set-Cookie;        # nothing here sets one, but never let it split cache
        add_header             X-Cache-Status $upstream_cache_status always;
    }

    # Telemetry and signed write-pipe webhooks remain private to NetBird.
    location ^~ /webhook/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.17.0.0/16;
        allow fd7a:54fe:a7cc:2ced::/64;
        deny all;
        proxy_pass http://127.0.0.1:5680;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Editor, REST API, and every non-public route are NetBird-only. 403 here is deliberate: the
    # NetBird allowlist answers before the upstream, so an outsider learns nothing about n8n.
    location / {
        allow 127.0.0.1;
        allow ::1;
        allow 10.17.0.0/16;
        allow fd7a:54fe:a7cc:2ced::/64;
        deny all;
        proxy_pass http://127.0.0.1:5680;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
