# Mnemora read API — the two nginx-level controls that bound abuse of it.
#
# Deployed at /etc/nginx/conf.d/00-mnemora-read-limits.conf on node1.
#
# /etc/nginx/conf.d/*.conf is included INSIDE http{}, which is why the zone and the cache path live
# here: neither `limit_req_zone` nor `proxy_cache_path` is legal in server context. The matching
# server block is mnemora-api.conf.
#
# The read key proves who is calling. It does not decide how often. Without these, a leaked key — or
# a loop in a caller — is unlimited against n8n, where every request is a workflow execution.
#
# Two zones, two different jobs:
#
#   mnemora_read      per source address, 10 r/s with a burst of 20. Stops one host hammering the
#                     API. Honest limitation: the normal caller is the Cloudflare Worker, and
#                     mnemora-api.syn-forge.com is grey-cloud DNS, so requests arrive from Cloudflare
#                     egress addresses with no CF-Connecting-IP — real_ip cannot recover a visitor.
#                     This bounds a single abusive source, not a crowd.
#
#   mnemora_read_all  one bucket for the whole API, 30 r/s. This is the ceiling that protects n8n's
#                     execution slots no matter how many sources are involved. The API's own measured
#                     ceiling is ~32 req/s, so this sits just under it.
#
# Measured on node1 after install: 60 truly concurrent requests answer 27 x 200 and 33 x 429, while
# sequential traffic never sees the limit (the allowance is burst 20 plus 10 r/s of refill, so a
# 40-request stepped burst passes cleanly — a burst test must be concurrent to mean anything).
#
# Cache: the data moves hourly and every 200 already carries
# `Cache-Control: public, max-age=60, stale-while-revalidate=300`, so one upstream fetch per URL per
# minute turns visitors into ~nothing. `lock` means a burst on one key costs one execution instead of
# one per caller. The cache key includes the query string because both feeds page by cursor
# (`?before_ms=`), and a path-only key would serve page 2 to a caller asking for page 1.
#
# Purging: if `proxy_cache_key` ever changes, `rm -rf /var/cache/nginx/mnemora/*` once. Entries are
# filed under the old key string and stay readable to whoever computes that string — measured: when
# the read key was added to the key, unauthenticated callers kept getting a stale 200 from entries
# written before the change until the directory was purged.
limit_req_zone $binary_remote_addr zone=mnemora_read:10m rate=10r/s;
limit_req_zone $server_name        zone=mnemora_read_all:1m rate=30r/s;

proxy_cache_path /var/cache/nginx/mnemora levels=1:2 keys_zone=mnemora_api:10m
                 max_size=64m inactive=10m use_temp_path=off;
