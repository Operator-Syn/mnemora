name: Frontend Worker CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "biome.json"
      - ".github/workflows/frontend-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "biome.json"
      - ".github/workflows/frontend-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npx biome check src scripts

      - name: Generate TanStack route tree
        working-directory: frontend
        run: npm run generate-routes

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend Worker
        working-directory: frontend
        run: npm run build

      # Deploying needs a Cloudflare API token in the repository's secrets. Until that exists this is
      # a deliberate no-op that says so out loud, instead of a red run that teaches everyone to ignore
      # CI: `cd frontend && npx wrangler deploy` is the manual path for now. Add the secret and the
      # same step starts deploying, with no other change.
      - name: Check for the deploy token
        id: deploy_token
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Worker not deployed::CLOUDFLARE_API_TOKEN is unset, so this run verified the build and shipped nothing. Deploy by hand: cd frontend && npx wrangler deploy"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.deploy_token.outputs.have_token == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          workingDirectory: frontend
          command: deploy
