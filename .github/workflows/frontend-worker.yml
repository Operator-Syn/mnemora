name: Frontend Worker CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "biome.json"
      - ".github/workflows/frontend-worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "biome.json"
      - ".github/workflows/frontend-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npx biome check src scripts

      - name: Generate TanStack route tree
        working-directory: frontend
        run: npm run generate-routes

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend Worker
        working-directory: frontend
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          workingDirectory: frontend
          command: deploy
